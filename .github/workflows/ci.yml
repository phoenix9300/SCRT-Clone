name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test peers (OpenSSH server, lrzsz, PuTTY tools)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server lrzsz putty-tools
      - name: Web UI
        run: cd web && npm ci && npm run typecheck && npm test && npm run build
      - name: Go
        run: go vet ./... && go test ./...
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/hawser
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/hawser
